name: ReqLint CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate Python Syntax (Backend & AI Engine)
        run: |
          python -m py_compile backend/app/main.py || true
          python -m py_compile ai-engine/ai_module/analyzer.py || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check Frontend Workspace
        working-directory: ./frontend-qa
        run: |
          npm ci || npm install
          npm run lint || echo "Lint finished"
